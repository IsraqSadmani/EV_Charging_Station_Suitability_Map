const COL={High:'#4CE600',Medium:'#FFAA00',Low:'#FF0000'};
const LABEL_ZOOM=15;
const map=L.map('map',{zoomControl:false,preferCanvas:false});
L.control.zoom({position:'topright'}).addTo(map);
L.control.scale({imperial:false,position:'bottomright'}).addTo(map);
const gOpt={maxZoom:22,maxNativeZoom:21,subdomains:['mt0','mt1','mt2','mt3'],attribution:'Map data &copy; Google'};
const gStreet=L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',gOpt);
const gSat=L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',gOpt);
const gHyb=L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',gOpt);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,maxNativeZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
const carto=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:22,maxNativeZoom:20,subdomains:'abcd',attribution:'&copy; OpenStreetMap contributors &copy; CARTO'});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22,maxNativeZoom:19,attribution:'Imagery &copy; Esri'});
const none=L.layerGroup();
const bases={'Google Streets':gStreet,'Google Satellite':gSat,'Google Hybrid':gHyb,'OpenStreetMap':osm,'CartoDB Positron':carto,'Esri World Imagery':sat,'No basemap':none};
gStreet.addTo(map);
L.control.layers(bases,null,{position:'topright'}).addTo(map);
map.on('baselayerchange',e=>document.body.classList.toggle('sat',/Satellite|Imagery/.test(e.name)));
// If basemap tiles are blocked (e.g. inside a sandboxed host), fall back quietly
let tileErr=0,tileOk=0;
[gStreet,gSat,gHyb,osm,carto,sat].forEach(t=>{t.on('tileerror',()=>{tileErr++;check()});t.on('tileload',()=>{tileOk++})});
function check(){if(tileErr>=6&&tileOk===0){map.eachLayer(l=>{if(l instanceof L.TileLayer)map.removeLayer(l)});none.addTo(map);
 document.getElementById('msg').textContent='Basemap tiles could not load here; showing plots only.';}}
const total=DATA.features.length;document.getElementById('total').textContent=total;
const counts={High:0,Medium:0,Low:0};DATA.features.forEach(f=>counts[f.properties.Suit]=(counts[f.properties.Suit]||0)+1);
Object.keys(counts).forEach(k=>{const e=document.getElementById('n-'+k);if(e)e.textContent=counts[k]});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FIELDS=[['Mauza','Mauza'],['JL_No','JL No'],['Sheet_No','Sheet No'],['Plot_No','Plot No'],['Mz_Ver','Survey'],['Area_katha','Area (katha)'],['Cur_Use','Current use'],['M_Thana','Thana'],['Upazila_PS','Upazila/PS'],['M_U_P_CC','Union/CC'],['M_Ward','Ward'],['M_District','District'],['Remarks_1','Remarks']];
function popup(p){const c=COL[p.Suit]||'#888';
 let rows=FIELDS.filter(([k])=>p[k]!==undefined&&p[k]!=='').map(([k,n])=>`<tr><td>${n}</td><td>${esc(k==='Area_katha'?(+p[k]).toFixed(2):p[k])}</td></tr>`).join('');
 return `<div class="pop"><h3>${esc(p.JL_Sh_Plot)}</h3><div style="margin-bottom:6px"><span class="badge" style="border-color:${c}">${esc(p.Suit)} suitability</span></div><table>${rows}</table></div>`;}
const byId={};const polys={High:L.featureGroup(),Medium:L.featureGroup(),Low:L.featureGroup()};
const dots={High:L.featureGroup(),Medium:L.featureGroup(),Low:L.featureGroup()};
DATA.features.forEach(f=>{const p=f.properties,c=COL[p.Suit]||'#888';
 const lyr=L.geoJSON(f,{style:{color:c,weight:3,opacity:1,fillColor:c,fillOpacity:0.08}});
 lyr.bindPopup(popup(p),{maxWidth:300});
 lyr.bindTooltip(esc(p.JL_Sh_Plot),{permanent:true,direction:'center',className:'plot-label'});
 lyr.addTo(polys[p.Suit]);
 const ctr=lyr.getBounds().getCenter();
 const d=L.circleMarker(ctr,{radius:6,color:c,weight:3,fillColor:'#fff',fillOpacity:0.9}).bindPopup(popup(p),{maxWidth:300}).bindTooltip(esc(p.JL_Sh_Plot),{direction:'top',offset:[0,-6]});
 d.addTo(dots[p.Suit]);
 byId[String(p.JL_Sh_Plot).toLowerCase()]={lyr,p};
});
const all=L.featureGroup(Object.values(polys));
function fitAll(){map.fitBounds(all.getBounds(),{padding:[40,40]})}
fitAll();
function active(s){return document.querySelector(`input[data-s="${s}"]`).checked}
function refresh(){const z=map.getZoom();const showLbl=document.getElementById('lbl').checked&&z>=LABEL_ZOOM;
 Object.keys(polys).forEach(s=>{const on=active(s);
  if(on)polys[s].addTo(map);else map.removeLayer(polys[s]);
  if(on&&z<LABEL_ZOOM)dots[s].addTo(map);else map.removeLayer(dots[s]);
  polys[s].eachLayer(g=>g.eachLayer(l=>{if(showLbl)l.openTooltip();else l.closeTooltip()}));});}
map.on('zoomend',refresh);
document.querySelectorAll('input[data-s]').forEach(i=>i.addEventListener('change',refresh));
document.getElementById('lbl').addEventListener('change',refresh);
document.getElementById('fit').addEventListener('click',fitAll);
function find(){const v=document.getElementById('q').value.trim().toLowerCase();const m=document.getElementById('msg');if(!v)return;
 let hit=byId[v];if(!hit){const k=Object.keys(byId).find(k=>k.includes(v));hit=k&&byId[k];}
 if(!hit){m.textContent='No plot matches “'+v+'”.';return}
 m.textContent='';const s=hit.p.Suit;const box=document.querySelector(`input[data-s="${s}"]`);if(!box.checked){box.checked=true;}
 map.fitBounds(hit.lyr.getBounds(),{maxZoom:18});setTimeout(()=>{refresh();hit.lyr.openPopup()},350);}
document.getElementById('go').addEventListener('click',find);
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});
const panel=document.getElementById('panel');
document.getElementById('collapse').addEventListener('click',e=>{panel.classList.toggle('min');e.target.textContent=panel.classList.contains('min')?'+':'–'});
setTimeout(refresh,0);
</script>
</body></html>
